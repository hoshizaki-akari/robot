# Response knobs for this AUBO-only workstation. Adjust here, then restart.
aubo_v4_state_node:
  ros__parameters:
    enable_follow_traction: true
    # Reversal no longer waits for a complete stop at an obsolete endpoint.
    follow_update_interval_s: 0.03
    follow_horizon_s: 0.16
    # Drag must not hit the force-mode 5 mm lead ceiling for nearly every force.
    drag_maximum_step_m: 0.020
    drag_follow_horizon_s: 0.10
    follow_hold_enabled: true
    follow_reference_enabled: true
    fixed_follow_profile: true
    single_stop_when_quiescent: true
    subdivide_follow_joint_steps: false
    adaptive_follow_ik: true
    # Zero/reversal stays in follow mode; FastStop is reserved for actual stops.
    brake_on_hold: false
    stop_timeout_s: 5.0
    maximum_speed_mps: 0.200
    session_orientation_tolerance_rad: 0.10
    # Use the supported profile range, while force maps to paced target speed.
    follow_response_scale: 5.0
    fast_line_acceleration_mps2: 0.20
    # Diagnosis queries have their own budget; waypoint freshness stays 0.5 s.
    telemetry_timeout_s: 1.2
traction_controller:
  ros__parameters:
    # Gain multiplier and speed ceiling remain independently adjustable.
    drag_response_scale: 1.0
    # Separate residual/noise release from deliberate input; not a force ceiling.
    stepwise_drag_release_gate_enabled: true
    drag_start_force_n: 0.65
    drag_release_force_n: 0.35
    stepwise_drag_deadband_n: 0.35
    # Linear 10 mm/s/N above release deadband; saturates near 20.35 N, not 5 N.
    stepwise_drag_gain_mps_per_n: 0.010
    stepwise_drag_minimum_speed_mps: 0.0
    drag_max_speed_mps: 0.200
    stepwise_drag_maximum_speed_mps: 0.200
    # Previous fallback 0.0002 m/s/N kept both modes near 1.2 mm/s.
    stepwise_force_gain_mps_per_n: 0.010
    stepwise_force_deadband_n: 0.15
    stepwise_minimum_command_speed_mps: 0.0
    stepwise_force_soft_transition_n: 0.25
    stepwise_velocity_ramp_enabled: true
traction_manager:
  ros__parameters:
    constant_force_slack_hold_enabled: true
    slack_release_force_n: 1.2
    slack_resume_force_n: 1.8
    slack_recovery_confirm_s: 0.20
