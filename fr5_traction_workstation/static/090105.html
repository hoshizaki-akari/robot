<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>骨伤牵引机器人工作站</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1e3a5f;
      --blue: #3b82f6;
      --green: #16a34a;
      --red: #dc2626;
      --orange: #f59e0b;
      --muted: #64748b;
      --line: #e2e8f0;
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #eef2f7; color: #1f2937;
    }
    button, input, select { font-family: inherit; }
    button:disabled { opacity: .42; cursor: not-allowed !important; }

    .top-bar {
      height: 64px; padding: 0 22px; background: var(--navy); color: #fff;
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      box-shadow: 0 3px 12px rgba(15, 23, 42, .18);
    }
    .top-left, .top-right { display: flex; align-items: center; gap: 10px; }
    .top-right { justify-content: flex-end; }
    .top-bar h1 { font-size: 24px; font-weight: 700; letter-spacing: 3px; }
    .nav-btn {
      border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.12);
      color: #fff; padding: 8px 16px; border-radius: 7px; font-size: 15px;
      cursor: pointer; transition: .18s;
    }
    .nav-btn:hover { background: rgba(255,255,255,.24); }
    .nav-btn.shutdown { border-color: rgba(254,202,202,.55); background: rgba(220,38,38,.28); }
    .nav-btn.shutdown:hover { background: rgba(220,38,38,.48); }
    .user-chip {
      display: flex; align-items: center; gap: 8px; padding: 7px 12px;
      border-radius: 8px; background: rgba(255,255,255,.1); font-size: 14px;
    }
    .role-tag { padding: 2px 7px; border-radius: 10px; background: #dbeafe; color: #1d4ed8; font-size: 12px; }

    .main-container {
      height: calc(100% - 64px); display: grid; grid-template-columns: minmax(330px, 31%) minmax(0, 1fr);
      gap: 16px; padding: 16px;
    }
    .left-area, .right-area { display: flex; flex-direction: column; gap: 14px; min-width: 0; min-height: 0; }
    .card {
      background: #fff; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.08);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .card-title {
      min-height: 56px; padding: 13px 20px; border-bottom: 2px solid #e8ecf1;
      color: var(--navy); font-size: 21px; font-weight: 700;
      display: flex; align-items: center; justify-content: space-between;
    }
    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-size: 13px; font-weight: 500; }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .status.running { color: #f59e0b; }
    .status.offline { color: var(--red); }

    .arm-panel { flex: 1.05; background: #323232; min-height: 0; }
    .arm-img-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
    .arm-img-wrap img { width: 100%; height: 100%; object-fit: contain; }
    #robotViewer { width: 100%; height: 100%; min-height: 210px; }
    #robotViewer canvas { display: block; width: 100%; height: 100%; }
    .image-fallback { color: #cbd5e1; text-align: center; line-height: 1.8; }
    .image-fallback strong { display: block; color: #fff; font-size: 26px; }

    .curve-panel { flex: .95; padding: 0 14px 14px; min-height: 180px; }
    .curve-panel .card-title { margin: 0 -14px 10px; }
    #forceCanvas { flex: 1; width: 100%; min-height: 0; border-radius: 10px; background: #f8fafc; border: 1px solid var(--line); }

    .operation-panel { flex: 1; min-height: 0; padding-bottom: 18px; }
    .operation-title { flex: 0 0 58px; }
    .compact-status { display: flex; align-items: center; gap: 18px; font-size: 14px; font-weight: 600; }
    .compact-status-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .compact-status-item::before {
      content: ""; width: 7px; height: 7px; flex: 0 0 7px; border-radius: 50%; background: currentColor;
    }
    .compact-status-label { color: var(--muted); font-weight: 400; }
    .state-value { color: var(--green); font-size: 14px; font-weight: 600; white-space: nowrap; }
    #workStatus.running, #directionState.following { color: #d97706; }
    #tensionState { color: #d97706; }
    #tensionState.tight { color: var(--green); }
    .mode-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
      padding: 18px 24px 12px;
    }
    .mode-btn {
      min-height: 66px; border: 2px solid #aebdce; border-radius: 14px; padding: 10px 16px;
      background: #fff; color: #334155; font-size: clamp(28px, 1.65vw, 33px); font-weight: 900;
      line-height: 1; letter-spacing: .24em; text-indent: .24em; cursor: pointer;
      box-shadow: 0 3px 8px rgba(15,23,42,.06); transition: .15s;
    }
    .mode-btn.active {
      border-color: var(--blue); background: var(--blue); color: #fff;
      box-shadow: 0 5px 14px rgba(59,130,246,.28);
    }
    .force-content {
      flex: 1; min-height: 0; display: grid; grid-template-columns: 148px minmax(430px, 1fr) 148px;
      align-items: center; gap: 28px; padding: 10px 30px 14px;
    }
    .round-btn-group { display: flex; flex-direction: column; gap: 34px; align-items: center; }
    .round-btn {
      width: 138px; height: 138px; border-radius: 50%; border: 5px solid #d1d5db;
      background: #fff; font-size: 38px; font-weight: 900; letter-spacing: .02em;
      cursor: pointer; transition: .15s;
      box-shadow: 0 5px 15px rgba(15,23,42,.08);
    }
    .round-btn:active:not(:disabled) { transform: scale(.95); }
    .round-btn.minus { color: var(--red); border-color: #fca5a5; }
    .round-btn.plus { color: var(--green); border-color: #86efac; }
    .force-board {
      width: 100%; height: clamp(270px, 32vh, 320px);
      display: grid; grid-template-columns: 1fr 2px 1fr; align-items: stretch;
      border: 3px solid #cbd8e8; border-radius: 38px; overflow: hidden; background: #fff;
      box-shadow: 0 10px 26px rgba(30,58,95,.12);
    }
    .force-metric {
      min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 22px 16px;
    }
    .force-metric-label {
      color: var(--muted); font-size: 29px; font-weight: 800; line-height: 1;
      letter-spacing: .12em; text-indent: .12em; margin-bottom: 18px;
    }
    .force-divider { width: 2px; margin: 30px 0; background: #cbd5e1; }
    .force-number { display: flex; align-items: baseline; justify-content: center; min-width: 0; }
    .force-value-target {
      width: 188px; border: 0; outline: 0; background: transparent; text-align: right;
      font: inherit; font-size: 98px; font-weight: 900; color: var(--navy);
      appearance: textfield; -moz-appearance: textfield;
    }
    .force-value-target::-webkit-inner-spin-button,
    .force-value-target::-webkit-outer-spin-button { appearance: none; margin: 0; }
    .force-unit-target { font-size: 52px; font-weight: 800; color: var(--blue); margin-left: 8px; }
    .actual-force-value { color: var(--navy); font-size: 98px; font-weight: 900; line-height: 1; }
    .actual-force-unit { color: var(--green); font-size: 52px; font-weight: 800; margin-left: 8px; }
    .control-grid {
      flex: 0 0 224px; display: grid; grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr); gap: 16px 20px; padding: 0 30px;
    }
    .action-btn {
      border: 0; border-radius: 17px; color: #fff; font-size: clamp(32px, 1.85vw, 38px); font-weight: 900;
      line-height: 1; letter-spacing: .28em; text-indent: .28em;
      cursor: pointer; box-shadow: 0 5px 14px rgba(15,23,42,.13); transition: .15s;
    }
    .action-btn:active:not(:disabled) { transform: translateY(2px); }
    .action-btn.start { background: var(--green); }
    .action-btn.stop { background: var(--orange); }
    .action-btn.emergency { background: var(--red); }
    .action-btn.emergency.recover { background: var(--green); }

    .modal-mask {
      position: fixed; inset: 0; z-index: 20; background: rgba(15,23,42,.55);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .modal-mask.hidden { display: none; }
    .modal {
      width: min(100%, 980px); max-height: 88vh; background: #fff; border-radius: 15px;
      box-shadow: 0 22px 60px rgba(0,0,0,.25); overflow: hidden; display: flex; flex-direction: column;
    }
    .modal.small { width: 430px; }
    .modal-header { padding: 17px 22px; background: var(--navy); color: #fff; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h2 { font-size: 20px; }
    .close-btn { border: 0; background: transparent; color: #fff; font-size: 26px; cursor: pointer; }
    .modal-body { padding: 22px; overflow: auto; }
    .form-item { margin-bottom: 17px; }
    .form-item label { display: block; color: #475569; font-size: 14px; margin-bottom: 7px; }
    .form-item input, .form-item select {
      width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 15px; outline: none;
    }
    .form-item input:focus, .form-item select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
    .primary-btn, .secondary-btn, .danger-btn {
      border: 0; padding: 10px 18px; border-radius: 7px; font-size: 15px; cursor: pointer;
    }
    .primary-btn { background: var(--blue); color: #fff; }
    .secondary-btn { background: #e2e8f0; color: #334155; }
    .danger-btn { background: #fee2e2; color: #b91c1c; }
    .login-btn { width: 100%; padding: 12px; }
    .login-tip { margin-top: 15px; padding: 11px; border-radius: 7px; background: #f1f5f9; color: #64748b; font-size: 13px; line-height: 1.7; }
    .error-tip { min-height: 20px; color: var(--red); font-size: 13px; margin-bottom: 8px; }
    .toolbar { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .toolbar-left, .toolbar-right { display: flex; gap: 9px; }
    .toolbar input, .toolbar select { padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 7px; }
    .table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 9px; }
    .row-export-btn { padding: 6px 10px; white-space: nowrap; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; font-size: 14px; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: center; }
    th { position: sticky; top: 0; background: #f1f5f9; color: #334155; }
    tbody tr:hover { background: #f8fafc; }
    .empty { padding: 32px; text-align: center; color: #94a3b8; }
    .permission-note { font-size: 13px; color: #64748b; margin-top: 8px; }
    .shutdown-copy { color: #334155; font-size: 18px; line-height: 1.7; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 22px; }
    .modal-actions .danger-btn { background: var(--red); color: #fff; }
    .toast {
      position: fixed; z-index: 50; left: 50%; bottom: 28px; transform: translateX(-50%);
      padding: 11px 22px; border-radius: 8px; background: #0f172a; color: #fff; opacity: 0;
      pointer-events: none; transition: .2s;
    }
    .toast.show { opacity: 1; }

    @media (max-height: 820px) and (min-width: 1051px) {
      .mode-grid { padding-top: 10px; padding-bottom: 8px; }
      .mode-btn { min-height: 56px; font-size: 26px; letter-spacing: .18em; text-indent: .18em; }
      .force-content { grid-template-columns: 128px minmax(390px, 1fr) 128px; gap: 18px; padding: 6px 22px 10px; }
      .round-btn-group { gap: 24px; }
      .round-btn { width: 118px; height: 118px; font-size: 31px; }
      .force-board { height: 250px; }
      .force-metric-label { font-size: 25px; letter-spacing: .1em; text-indent: .1em; margin-bottom: 10px; }
      .force-value-target { width: 150px; font-size: 82px; }
      .actual-force-value { font-size: 82px; }
      .force-unit-target, .actual-force-unit { font-size: 44px; }
      .control-grid { flex-basis: 190px; gap: 12px 16px; padding: 0 22px; }
      .action-btn { font-size: 29px; letter-spacing: .22em; text-indent: .22em; }
    }

    @media (max-width: 1050px) {
      .top-bar { grid-template-columns: auto 1fr auto; padding: 0 12px; }
      .top-bar h1 { font-size: 18px; text-align: center; }
      .user-chip span:first-child { display: none; }
      .main-container { grid-template-columns: minmax(280px, 34%) minmax(0, 1fr); gap: 10px; padding: 10px; }
      .compact-status { gap: 8px; font-size: 12px; }
      .compact-status-label { display: none; }
      .state-value { font-size: 12px; }
      .mode-grid { gap: 8px; padding: 10px 12px 6px; }
      .mode-btn { min-height: 48px; font-size: 20px; letter-spacing: .12em; text-indent: .12em; }
      .force-content { grid-template-columns: 82px minmax(260px, 1fr) 82px; gap: 8px; padding: 6px 12px 10px; }
      .round-btn-group { gap: 15px; }
      .round-btn { width: 76px; height: 76px; font-size: 20px; border-width: 3px; }
      .force-board { min-height: 190px; border-radius: 24px; }
      .force-metric-label { font-size: 17px; }
      .force-value-target { width: 95px; font-size: 54px; }
      .actual-force-value { font-size: 54px; }
      .force-unit-target, .actual-force-unit { font-size: 28px; }
      .control-grid { flex-basis: 150px; gap: 9px; padding: 0 12px; }
      .action-btn { font-size: 22px; letter-spacing: .16em; text-indent: .16em; }
    }
  </style>
</head>
<body>
  <header class="top-bar">
    <div class="top-left">
      <button class="nav-btn" id="settingsBtn">参数设置</button>
      <button class="nav-btn" id="recordsBtn">牵引记录</button>
    </div>
    <h1>骨伤牵引机器人工作站</h1>
    <div class="top-right">
      <div class="user-chip"><span id="currentUser">未登录</span><span class="role-tag" id="currentRole">访客</span></div>
      <button class="nav-btn" id="logoutBtn">退出登录</button>
      <button class="nav-btn shutdown" id="shutdownBtn">关闭程序</button>
    </div>
  </header>

  <main class="main-container">
    <section class="left-area">
      <div class="card arm-panel">
        <div class="card-title"><span>机械臂状态</span><span class="status" id="armStatus">通信正常</span></div>
        <div class="arm-img-wrap">
          <div id="robotViewer" aria-label="FR5机械臂实时姿态"></div>
        </div>
      </div>
      <div class="card curve-panel">
        <div class="card-title"><span>牵引力曲线</span><span id="recordTimer">未开始记录</span></div>
        <canvas id="forceCanvas"></canvas>
      </div>
    </section>

    <section class="right-area">
      <div class="card operation-panel">
        <div class="card-title operation-title">
          <span>牵引力调节</span>
          <div class="compact-status" aria-label="实时状态">
            <span class="compact-status-item"><span class="compact-status-label">任务</span><strong class="state-value" id="workStatus">设备就绪</strong></span>
            <span class="compact-status-item"><span class="compact-status-label">牵引带</span><strong class="state-value" id="tensionState">松弛</strong></span>
            <span class="compact-status-item"><span class="compact-status-label">方向</span><strong class="state-value" id="directionState">方向稳定</strong></span>
          </div>
        </div>
        <div class="mode-grid" aria-label="工作模式">
          <button class="mode-btn" data-mode="2">省力拖拽</button>
          <button class="mode-btn" data-mode="1">位置牵引</button>
          <button class="mode-btn active" data-mode="0">恒力牵引</button>
        </div>
        <div class="force-content">
          <div class="round-btn-group">
            <button class="round-btn minus force-adjust" data-step="-5">−5N</button>
            <button class="round-btn minus force-adjust" data-step="-10">−10N</button>
          </div>
          <div class="force-board">
            <div class="force-metric">
              <div class="force-metric-label">目标牵引力</div>
              <div class="force-number">
                <input class="force-value-target" id="targetForceVal" type="number" min="1" max="20" step="0.1" value="10" inputmode="decimal" aria-label="目标牵引力">
                <span class="force-unit-target">N</span>
              </div>
            </div>
            <div class="force-divider" aria-hidden="true"></div>
            <div class="force-metric">
              <div class="force-metric-label">当前牵引力</div>
              <div class="force-number">
                <strong class="actual-force-value" id="actualForceVal">0.0</strong>
                <span class="actual-force-unit">N</span>
              </div>
            </div>
          </div>
          <div class="round-btn-group">
            <button class="round-btn plus force-adjust" data-step="5">+5N</button>
            <button class="round-btn plus force-adjust" data-step="10">+10N</button>
          </div>
        </div>
        <div class="control-grid">
          <button class="action-btn start" id="prepareBtn" title="牵引带松弛时点击">初始校准</button>
          <button class="action-btn start" id="calibrateBtn" disabled title="张紧后保持法兰不动">方向确定</button>
          <button class="action-btn start" id="startBtn" disabled>开始牵引</button>
          <button class="action-btn stop" id="stopBtn" disabled>结束牵引</button>
          <button class="action-btn emergency" id="emergencyBtn" disabled>急停</button>
          <button class="action-btn stop" id="returnZeroBtn" disabled>回零</button>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-mask" id="loginModal">
    <div class="modal small">
      <div class="modal-header"><h2>系统登录</h2></div>
      <div class="modal-body">
        <div class="form-item"><label for="username">用户名</label><input id="username" autocomplete="username" placeholder="请输入用户名"></div>
        <div class="form-item"><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码"></div>
        <div class="error-tip" id="loginError"></div>
        <button class="primary-btn login-btn" id="loginBtn">登录系统</button>
        <div class="login-tip">演示账号：管理员 admin/admin123；医生 doctor/doctor123；操作员 operator/operator123。</div>
      </div>
    </div>
  </div>

  <div class="modal-mask hidden" id="recordsModal">
    <div class="modal">
      <div class="modal-header"><h2>牵引记录</h2><button class="close-btn" data-close="recordsModal">×</button></div>
      <div class="modal-body">
        <div class="toolbar">
          <div class="toolbar-left"><input id="recordSearch" placeholder="搜索编号或操作人员"><select id="recordStatusFilter"><option value="">全部状态</option><option value="已完成">已完成</option><option value="异常终止">异常终止</option></select></div>
          <div class="toolbar-right"><button class="secondary-btn" id="exportBtn">导出全部摘要</button></div>
        </div>
        <div class="table-wrap">
          <table><thead><tr><th>记录编号</th><th>模式</th><th>开始时间</th><th>结束时间</th><th>操作人员</th><th>角色</th><th>目标力(N)</th><th>平均力(N)</th><th>最大力(N)</th><th>状态</th><th>原因</th><th>导出</th></tr></thead><tbody id="recordsBody"></tbody></table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-mask hidden" id="settingsModal">
    <div class="modal small">
      <div class="modal-header"><h2>牵引参数设置</h2><button class="close-btn" data-close="settingsModal">×</button></div>
      <div class="modal-body">
        <div class="form-item"><label>默认目标牵引力（N）</label><input id="settingTarget" type="number" min="1" max="20" step="0.1"></div>
        <button class="primary-btn" id="saveSettingsBtn">保存参数</button>
      </div>
    </div>
  </div>

  <div class="modal-mask hidden" id="shutdownModal">
    <div class="modal small" role="dialog" aria-modal="true" aria-labelledby="shutdownTitle">
      <div class="modal-header"><h2 id="shutdownTitle">关闭程序</h2></div>
      <div class="modal-body">
        <p class="shutdown-copy" id="shutdownPrompt">确认关闭工作站程序和机器人控制服务吗？</p>
        <div class="modal-actions">
          <button class="secondary-btn" id="cancelShutdownBtn">取消</button>
          <button class="danger-btn" id="confirmShutdownBtn">确认关闭</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "/assets/vendor/three.module.js",
        "three/addons/": "/assets/vendor/"
      }
    }
  </script>
  <script type="module" src="/assets/robot_viewer.js?v=20260907-clinician-layout"></script>
<script type="text/plain" id="legacyLogic">
    Legacy traction logic is intentionally disabled. The active compatibility page
    uses /api/traction/* and the ROS2 traction manager; it does not simulate force,
    persist traction records in the browser, or issue robot SDK commands.
  </script>
  <script src="/assets/090105.js?v=20260918-smooth-drag-shutdown"></script>
</body>
</html>
