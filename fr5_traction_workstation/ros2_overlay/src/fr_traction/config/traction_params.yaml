traction_controller:
  ros__parameters:
    control_rate_hz: 100.0
    force_filter_cutoff_hz: 5.0
    integral_gain_s_inv: 0.25
    integral_limit_n: 3.0
    virtual_mass: 10.0
    virtual_damping: 80.0
    force_deadband_n: 0.15
    traction_max_speed_mps: 0.020
    traction_max_acc_mps2: 0.02
    direction_correction_max_speed_mps: 0.020
    combined_max_speed_mps: 0.025
    pretension_speed_mps: 0.002
    # Pause output quickly when feedback/commands stop. The manager below has
    # a longer fault window so one recoverable SDK jitter does not end a run.
    wrench_timeout_s: 0.25
    command_timeout_s: 0.25
    wrench_topic: /traction/corrected_wrench
    command_topic: /traction/command
    cartesian_command_topic: /controller_manager/command_cart_vel
    velocity_command_topic: /traction/controller_velocity_cmd

traction_manager:
  ros__parameters:
    control_rate_hz: 100.0
    status_rate_hz: 20.0
    force_filter_cutoff_hz: 5.0
    # Active adaptive direction following. Small direction jitter is ignored;
    # a sustained direction is accepted as the new rope direction.
    direction_correction_mode: active
    direction_fast_cutoff_hz: 4.0
    direction_slow_cutoff_hz: 1.0
    direction_robust_window_size: 11
    direction_minimum_force_n: 0.5
    direction_recovery_confirm_s: 0.30
    direction_change_confirm_s: 0.20
    direction_settling_s: 0.50
    direction_candidate_max_dispersion_deg: 8.0
    direction_ambiguity_timeout_s: 8.0
    # Angular tracking rate is proportional to remaining angle (fast first,
    # slow near the target); the maximum is only a numerical guard.
    direction_tracking_gain_s_inv: 5.0
    direction_tracking_max_rate_deg_s: 180.0
    # Cartesian follow speed uses the same fast-then-slow angular law. There
    # is intentionally no accumulated direction-following distance limit.
    direction_follow_speed_gain_mps_per_rad: 0.020
    direction_correction_max_speed_mps: 0.020
    direction_follow_max_acceleration_mps2: 0.10
    # Fast through the large force error, slow down during the final 1 N.
    target_ramp_fast_nps: 3.0
    target_ramp_slow_nps: 0.5
    target_ramp_slow_window_n: 1.0
    pretension_detect_n: 1.0
    pretension_target_n: 3.0
    calibration_min_force_n: 0.5
    pretension_speed_mps: 0.002
    pretension_timeout_s: 10.0
    pretension_max_travel_m: 0.020
    # Two seconds gives the real ROS graph enough time to collect the
    # required stationary samples when WSL scheduling briefly jitters.
    calibration_window_s: 3.0
    calibration_min_samples: 40
    calibration_max_angle_p95_deg: 15.0
    target_force_min_n: 1.0
    target_force_max_n: 20.0
    validated_target_max_n: 20.0
    force_tolerance_n: 1.0
    # A 0.15 N deadband prevents the former 0.5 N shortfall while remaining
    # wider than the normal sensor noise after filtering.
    force_deadband_n: 0.15
    # Covers the longest configurable position-driven return plus generous
    # communication margin. Force control remains disabled throughout it.
    release_timeout_s: 300.0
    # Force magnitude and temporary lateral force are control inputs, not
    # software fault conditions. Hardware and workspace guards remain.
    # Maximum straight-line TCP distance from the pose captured when traction
    # starts. The web settings page may change it between 0.05 and 0.50 m.
    axial_travel_limit_m: 0.150
    # Two-stage stale-data handling: motion is disabled after 0.25 s, while
    # wrench/pose gaps still fault at 1.2 s. The FR5 SDK health heartbeat is
    # emitted by the same timer as ServoCart; a measured 0.607 s RPC gap needs
    # a separate 1.2 s heartbeat allowance to avoid a false control fault.
    motion_pause_timeout_s: 0.25
    wrench_timeout_s: 1.2
    ee_state_timeout_s: 1.2
    joint_state_topic: /joint_states
    controller_health_timeout_s: 1.2
    ui_heartbeat_timeout_s: 2.0
    require_ui_heartbeat: false
    # The direct FR5 driver owns the SDK and publishes these real-hardware
    # feedback topics under the compatibility /controller_manager namespace.
    wrench_topic: /controller_manager/wrench
    ee_state_topic: /controller_manager/ee_state
    command_topic: /traction/command
    controller_health_topic: /traction_controller/healthy
    hardware_health_topic: /controller_manager/healthy
    velocity_command_topic: /traction/controller_velocity_cmd
    corrected_wrench_topic: /traction/corrected_wrench
    ui_heartbeat_topic: /traction/ui_heartbeat
    slack_calibration_topic: /traction/slack_calibration
    pretraction_return_service: /traction/return_pretraction_pose
    pretraction_return_tolerance_m: 0.0015
    data_directory: debug/traction_sessions
    expected_wrench_frame: base_link
    controller_manager_switch_service: /controller_manager/switch_controller
